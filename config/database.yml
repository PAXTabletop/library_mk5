default: &default
  adapter: postgresql
# encoding set for win environments
  encoding: utf8
  pool: 5
  timeout: 5000
  host: localhost
  username: postgres
  password: <%= ENV["POSTGRES_PASSWORD"] %>

development:
  <<: *default
  database: <%= ENV.fetch("LIBRARY_DEV_DB", "library_mk5_dev") %>

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: <%= ENV.fetch("LIBRARY_TEST_DB", "library_mk4_test") %>

production:
  <<: *default
  database: <%= ENV.fetch("LIBRARY_PROD_DB", "library_mk4_prod") %>
